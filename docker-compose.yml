# Ambiente local de desenvolvimento.
# Sobe só o PostgreSQL; a API roda fora do container (npm run dev:api).
#
#   npm run db:up      sobe o banco em segundo plano
#   npm run db:down    para o banco (os dados ficam no volume)
#   npm run db:reset   para o banco e APAGA os dados do volume
#
# Versão alinhada com o Neon (PostgreSQL 17) para não haver diferença de
# comportamento entre local e produção.
# As credenciais abaixo são só para uso local; podem ser sobrescritas por
# variáveis de ambiente (ex.: POSTGRES_PORT=5433 se a 5432 já estiver em uso).

name: healthfitai

services:
  postgres:
    image: postgres:17-alpine
    container_name: healthfitai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user}
      POSTGRES_DB: ${POSTGRES_DB:-healthfitai}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
